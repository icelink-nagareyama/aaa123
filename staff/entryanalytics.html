<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイスパーク管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="app-icon.jpg"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script><meta name="referrer" content="no-referrer"><base target="_top"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
<style>.analytics-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.analytics-summary strong{display:block;font-size:30px;color:#143753}.analytics-summary small{font-size:13px;font-weight:400}.analytics-bar{height:9px;background:#e5f0f6;border-radius:10px;min-width:90px}.analytics-bar span{display:block;height:100%;background:#159fc9;border-radius:10px}.analytics-table{width:100%;border-collapse:collapse}.analytics-table th,.analytics-table td{padding:10px 12px;border-bottom:1px solid #e5edf4;text-align:right;white-space:nowrap}.analytics-table th:first-child,.analytics-table td:first-child{text-align:left}.analytics-scroll{overflow:auto}.analytics-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.analytics-filters .field{margin:0}.analytics-muted{color:#698098;font-size:13px}@media(max-width:650px){.analytics-summary{grid-template-columns:1fr}.analytics-filters input{max-width:100%}}</style>
</head><body class="layout-refresh" data-layout-page="EntryAnalytics"><section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>
<div class="app-shell"><div id="adminSidebar" class="sidebar"></div><main class="main-content">
<div class="page-header"><div><h1 class="page-header-title">入場データ分析</h1><p class="page-header-sub">日別・時間別の人数と構成比（管理者のみ）</p></div><span id="staffLabel" class="chip">権限確認中</span></div>
<div id="errorBox" class="msg-error" style="display:none" role="alert"></div>
<section class="card"><div class="analytics-filters"><div class="field"><label for="analyticsFrom">開始日</label><input id="analyticsFrom" type="date"></div><div class="field"><label for="analyticsTo">終了日</label><input id="analyticsTo" type="date"></div><button id="analyticsLoad" type="button" class="btn">集計を表示</button></div><p id="analyticsStatus" role="status">前日までの直近30日を表示します。</p></section>
<div id="analyticsResult" hidden><section class="analytics-summary"><div class="card">期間の入場人数<strong id="analyticsPeople"></strong></div><div class="card">記録がある日の平均<strong id="analyticsAverage"></strong></div><div class="card">最も入場が多い時間<strong id="analyticsPeak"></strong></div></section>
<section class="card"><h2 class="section-title">時間帯別の人数・割合</h2><div class="analytics-scroll"><table class="analytics-table"><thead><tr><th>時間帯</th><th>入場人数</th><th>期間内の割合</th><th>人数の比較</th></tr></thead><tbody id="analyticsHours"></tbody></table></div></section>
<section class="card"><h2 class="section-title">日ごとの推移</h2><div class="analytics-scroll"><table class="analytics-table"><thead><tr><th>日付</th><th>人数</th><th>受付組数</th><th>記録状況</th></tr></thead><tbody id="analyticsDays"></tbody></table></div></section><p id="analyticsDefinition" class="analytics-muted"></p><p id="analyticsCoverage" class="analytics-muted"></p></div>
</main></div><script>
var staffId=window.staffPortal.staffId,sessionToken=window.staffPortal.sessionToken,baseUrl=window.staffPortal.baseUrl;
function analyticsDate(d){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
document.getElementById('analyticsTo').value=analyticsDate(new Date(Date.now()-86400000));document.getElementById('analyticsFrom').value=analyticsDate(new Date(Date.now()-30*86400000));
function analyticsCell(row,value){var td=document.createElement('td');td.textContent=value;row.appendChild(td);return td;}
function analyticsRender(v){document.getElementById('analyticsResult').hidden=false;[['analyticsPeople',v.totalPeople.toLocaleString()+' 名'],['analyticsAverage',v.averagePerRecordedDay===null?'—':v.averagePerRecordedDay+' 名'],['analyticsPeak',v.peakHour||'入場記録なし']].forEach(function(p){var node=document.getElementById(p[0]);node.textContent=p[1].replace(/ 名$/,'');if(/ 名$/.test(p[1])){var unit=document.createElement('small');unit.textContent=' 名';node.appendChild(unit);}});var hours=document.getElementById('analyticsHours'),days=document.getElementById('analyticsDays');hours.replaceChildren();days.replaceChildren();var max=Math.max.apply(null,v.hours.map(function(h){return h.people;}));v.hours.filter(function(h){return h.people>0 || (h.hour>=10 && h.hour<21);}).forEach(function(h){var tr=document.createElement('tr');analyticsCell(tr,h.label);analyticsCell(tr,h.people+' 名');analyticsCell(tr,h.share===null?'—':h.share+'%');var cell=analyticsCell(tr,''),bar=document.createElement('div'),fill=document.createElement('span');bar.className='analytics-bar';fill.style.width=(max?h.people/max*100:0)+'%';bar.appendChild(fill);cell.appendChild(bar);hours.appendChild(tr);});v.days.forEach(function(d){var tr=document.createElement('tr');analyticsCell(tr,d.date);analyticsCell(tr,d.people+' 名');analyticsCell(tr,d.groups+' 組');analyticsCell(tr,d.groups?'入場記録あり':'入場記録なし');days.appendChild(tr);});document.getElementById('analyticsDefinition').textContent=v.definition;document.getElementById('analyticsCoverage').textContent=v.coverage;document.getElementById('analyticsStatus').textContent=v.from+' 〜 '+v.to+' ／ 入場記録がある日 '+v.daysWithEntries+'日'+(v.invalidRows?' ／ 不備のある記録 '+v.invalidRows+'件は集計対象外':'');}
var analyticsRequest=0;function analyticsLoad(){var id=++analyticsRequest,btn=document.getElementById('analyticsLoad');btn.disabled=true;document.getElementById('errorBox').style.display='none';staffRun().withSuccessHandler(function(v){if(id!==analyticsRequest)return;btn.disabled=false;analyticsRender(v);}).withFailureHandler(function(e){if(id!==analyticsRequest)return;btn.disabled=false;document.getElementById('analyticsResult').hidden=true;var box=document.getElementById('errorBox');box.textContent=e.message||String(e);box.style.display='block';}).getEntryAnalytics(document.getElementById('analyticsFrom').value,document.getElementById('analyticsTo').value);}
document.getElementById('analyticsLoad').onclick=analyticsLoad;renderAdminSidebar('entryanalytics');staffRun().withSuccessHandler(function(s){document.getElementById('staffLabel').textContent=s.staffName+'（管理者）';if(s.role==='ADMIN')analyticsLoad();}).getStaffById(staffId);
</script></body></html>
