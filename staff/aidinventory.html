<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイスパーク管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="app-icon.jpg"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script>
  <meta name="referrer" content="no-referrer">
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
</head>
<body data-layout-page="AidInventory" class="layout-refresh">
  <section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>

  <div class="app-shell">
    <div id="adminSidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-header-title">滑走補助具 在庫管理</h1>
          <div class="page-header-sub">貸出中の確認・返却処理・在庫数の設定を行います</div>
        </div>
        <div class="page-header-meta">
          <span class="chip" id="staffLabel">読み込み中...</span>
        </div>
      </div>

      <div id="errorBox" class="msg-error" style="display:none;"></div>

      <!-- 在庫状況サマリー -->
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
          <strong>在庫状況</strong>
          <span class="badge badge-warn" id="lowStockBadge" style="display:none;">在庫少</span>
        </div>
        <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat-card card" style="margin:0;">
            <div class="value" id="totalCount">-</div>
            <div class="label">総在庫数</div>
          </div>
          <div class="stat-card card" style="margin:0;">
            <div class="value" id="inUseCount">-</div>
            <div class="label">貸出中</div>
          </div>
          <div class="stat-card card" style="margin:0;">
            <div class="value" id="availableCount">-</div>
            <div class="label">貸出可能</div>
          </div>
        </div>
        <div class="loading mt-16" id="etaLabel"></div>
      </div>

      <div class="two-col">
        <div>
          <!-- 貸出中一覧 -->
          <div class="card">
            <div class="section-title">
              <span>貸出中</span>
              <span class="tag" id="activeTotalTag">0件</span>
            </div>
            <div class="list-row-table-head no-badge">
              <div>補助具番号／受付番号</div><div>貸出開始</div><div>操作</div>
            </div>
            <div id="activeList"></div>
          </div>

          <!-- 貸出開始 -->
          <div class="card">
            <div class="section-title">貸出を開始する</div>
            <div class="grid" style="grid-template-columns: 1fr 1fr;">
              <div class="field">
                <label>受付番号</label>
                <input type="text" id="startTicketNo" placeholder="例：001">
              </div>
              <div class="field">
                <label>バンド番号（任意）</label>
                <input type="text" id="startBandNo" placeholder="例：B001">
              </div>
            </div>
            <button class="btn" id="startBtn" style="width:100%;">貸出を開始する</button>
          </div>
        </div>

        <div class="two-col-side">
          <!-- 総在庫数の設定 -->
          <div class="card">
            <div class="section-title">総在庫数の設定</div>
            <p class="loading">変更は管理者のみ保存できます。</p>
            <div class="field">
              <label>総在庫数（個）</label>
              <input type="number" id="stockTotalInput" min="0">
            </div>
            <button class="btn btn-outline" id="saveStockTotalBtn" style="width:100%;">保存する</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var staffId = window.staffPortal.staffId;
    var sessionToken = window.staffPortal.sessionToken;
    var baseUrl = window.staffPortal.baseUrl;

    function showError(msg) {
      var box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function clearError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function renderInventory(v) {
      document.getElementById('totalCount').textContent = v.total;
      document.getElementById('inUseCount').textContent = v.inUse;
      document.getElementById('availableCount').textContent = v.available;
      document.getElementById('lowStockBadge').style.display = v.isLowStock ? 'inline-block' : 'none';
      document.getElementById('etaLabel').textContent =
        v.available > 0 ? '' : '次に貸出可能になる目安：' + v.nextAvailableEtaLabel;
      document.getElementById('stockTotalInput').value = v.total;

      document.getElementById('activeTotalTag').textContent = v.active.length + '件';
      var box = document.getElementById('activeList');
      if (v.active.length === 0) {
        box.innerHTML = '<div class="empty-hint">現在貸出中の補助具はありません</div>';
        return;
      }
      box.innerHTML = '';
      v.active.forEach(function (a) {
        var row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML =
          '<div class="list-row-table no-badge">' +
            '<div>' +
              '<div class="list-row-ticket">補助具 ' + (a.aidNo || '未割当') + ' ／ 受付 ' + a.ticketNo + '</div>' +
              '<div class="list-row-sub">' + a.bandNo + '</div>' +
            '</div>' +
            '<div>' +
              '<div>' + a.startTimeLabel + '（' + a.elapsedMin + '分経過）</div>' +
              (a.isOverdue ? '<span class="badge badge-warn">1時間超過</span>' : '<span class="badge badge-ok">貸出中</span>') +
            '</div>' +
            '<div class="list-row-table-actions">' +
              '<button class="btn btn-sm return-btn" data-log="' + a.logId + '">返却する</button>' +
            '</div>' +
          '</div>';
        box.appendChild(row);
      });
      document.querySelectorAll('.return-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { returnAid(btn.getAttribute('data-log')); });
      });
    }

    function loadInventory() {
      staffRun()
        .withSuccessHandler(renderInventory)
        .withFailureHandler(function (err) { showError('在庫状況の取得に失敗しました：' + (err && err.message ? err.message : err)); })
        .getAidInventoryView();
    }

    function returnAid(logId) {
      if (!window.confirm('返却処理をします。よろしいですか？')) return;
      clearError();
      staffRun()
        .withSuccessHandler(function (fee) {
          window.alert('返却しました。返却時の追加料金：¥' + Number(fee).toLocaleString());
          loadInventory();
        })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .returnAidRentalForGuest(logId);
    }

    document.getElementById('startBtn').addEventListener('click', function () {
      clearError();
      var ticketNo = document.getElementById('startTicketNo').value.trim();
      var bandNo = document.getElementById('startBandNo').value.trim();
      if (!ticketNo) {
        showError('受付番号を入力してください');
        return;
      }
      document.getElementById('startBtn').disabled = true;
      staffRun()
        .withSuccessHandler(function (result) {
          window.alert('補助具 ' + result.aidNo + ' 番を貸し出してください。');
          document.getElementById('startBtn').disabled = false;
          document.getElementById('startTicketNo').value = '';
          document.getElementById('startBandNo').value = '';
          loadInventory();
        })
        .withFailureHandler(function (err) {
          document.getElementById('startBtn').disabled = false;
          showError((err && err.message ? err.message : err));
        })
        .addAidRentalForGuest(ticketNo, bandNo, staffId);
    });

    document.getElementById('saveStockTotalBtn').addEventListener('click', function () {
      clearError();
      var v = document.getElementById('stockTotalInput').value;
      document.getElementById('saveStockTotalBtn').disabled = true;
      staffRun()
        .withSuccessHandler(function () {
          document.getElementById('saveStockTotalBtn').disabled = false;
          loadInventory();
        })
        .withFailureHandler(function (err) {
          document.getElementById('saveStockTotalBtn').disabled = false;
          showError((err && err.message ? err.message : err));
        })
        .updateAidStockTotal(v, staffId);
    });

    function loadStaffLabel() {
      if (!staffId) return;
      staffRun()
        .withSuccessHandler(function (staff) {
          if (staff) {
            document.getElementById('staffLabel').textContent =
              staff.staffName + (staff.role === 'ADMIN' ? '（管理者）' : '');
          }
        })
        .getStaffById(staffId);
    }

    renderAdminSidebar('aidinventory');
    loadStaffLabel();
    loadInventory();
    setInterval(loadInventory, 15000);
  </script>
</body>
</html>
