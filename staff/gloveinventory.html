<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script><meta name="referrer" content="no-referrer"><base target="_top"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
<style>.glove-stock-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.glove-stock-cards strong{font-size:34px;color:#123954}.glove-stock-cards small{font-size:13px}.glove-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.glove-stock-controls{display:flex;gap:8px;flex-wrap:wrap}.glove-history-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.glove-history-filters .field{min-width:130px;margin:0}.glove-history-scroll{overflow:auto}.glove-history-table{border-collapse:collapse;width:100%;font-size:13px}.glove-history-table td,.glove-history-table th{padding:12px 10px;text-align:left;border-bottom:1px solid #dfe8ef;white-space:nowrap}.glove-history-table td:last-child{white-space:pre-wrap;min-width:180px;max-width:360px;overflow-wrap:anywhere}.glove-add{color:#098b6b;font-weight:700}.glove-subtract{color:#966119;font-weight:700}@media(max-width:600px){.glove-fields{grid-template-columns:1fr}.glove-stock-cards{gap:10px}.glove-stock-cards .card{padding:14px}.glove-stock-cards strong{font-size:28px}}</style>
</head><body class="layout-refresh" data-layout-page="GloveInventory"><section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>
<div class="app-shell"><div id="adminSidebar" class="sidebar"></div><main class="main-content">
<div class="page-header"><div><h1 class="page-header-title">手袋在庫・履歴</h1><p class="page-header-sub">サイズ別の現在庫、入荷・棚卸・受付での使用履歴</p></div><span class="chip" id="staffLabel">読み込み中</span></div>
<div id="errorBox" class="msg-error" role="alert" style="display:none"></div><div id="gloveStockCards" class="glove-stock-cards"></div>
<section class="card"><h2 class="section-title">在庫を登録・追加</h2><p id="gloveStockNotice" class="loading"></p><div class="glove-fields"><div class="field"><label for="gloveStockSize">サイズ</label><select id="gloveStockSize"><option>S</option><option>L</option></select></div><div class="field"><label for="gloveStockKind">操作</label><select id="gloveStockKind"><option value="RECEIVE">入荷（在庫に追加）</option><option value="COUNT">実数を設定・棚卸（初回はこちら）</option></select></div><div class="field"><label for="gloveStockQuantity">数量（枚）</label><input id="gloveStockQuantity" type="number" min="0" max="1000000" step="1" inputmode="numeric"></div><div class="field"><label for="gloveStockNote">理由・メモ（必須）</label><input id="gloveStockNote" maxlength="200" placeholder="例：納品分を追加、営業終了時の棚卸"></div></div><div class="glove-stock-controls"><button id="gloveStockSave" type="button" class="btn" disabled>在庫を保存</button><button id="gloveStockRefresh" type="button" class="btn btn-outline">最新の在庫・保存状態を確認</button></div><p id="gloveStockMessage" role="status" aria-live="polite"></p></section>
<section class="card"><h2 class="section-title">在庫の変更履歴</h2><div class="glove-history-filters"><div class="field"><label for="gloveHistorySize">サイズ</label><select id="gloveHistorySize"><option value="">すべて</option><option>S</option><option>L</option></select></div><div class="field"><label for="gloveHistoryKind">区分</label><select id="gloveHistoryKind"><option value="">すべて</option><option value="RECEIVE">入荷</option><option value="COUNT">実数設定・棚卸</option><option value="RECEPTION">受付での使用・数量訂正</option></select></div><div class="field"><label for="gloveHistoryFrom">開始日</label><input id="gloveHistoryFrom" type="date"></div><div class="field"><label for="gloveHistoryTo">終了日</label><input id="gloveHistoryTo" type="date"></div><button id="gloveHistorySearch" type="button" class="btn btn-outline">絞り込む</button></div>
<p id="gloveHistoryStatus" role="status"></p><div class="glove-history-scroll"><table class="glove-history-table"><thead><tr><th>日時</th><th>サイズ</th><th>区分</th><th>増減</th><th>変更後の在庫</th><th>担当者ID</th><th>理由・メモ</th></tr></thead><tbody id="gloveHistoryRows"></tbody></table></div><button id="gloveHistoryMore" type="button" class="btn btn-outline mt-16" hidden>さらに過去の履歴を見る</button></section>
</main></div><script>
var staffId=window.staffPortal.staffId,sessionToken=window.staffPortal.sessionToken,baseUrl=window.staffPortal.baseUrl;
(function(){var view=null,busy=false,pending=null,key='icepark.gloves.page.pending.'+staffId+'.'+sessionToken,next=null,historyBusy=false,historyVersion=0,filters={},shown=0;function $(id){return document.getElementById(id);}function message(t){$('gloveStockMessage').textContent=t;}function lock(){['gloveStockSize','gloveStockKind','gloveStockQuantity','gloveStockNote','gloveStockSave'].forEach(function(id){$(id).disabled=busy||!!pending||!view;});$('gloveStockRefresh').disabled=busy;}
function persist(){try{if(pending)sessionStorage.setItem(key,JSON.stringify(pending));else sessionStorage.removeItem(key);}catch(e){}}
function render(v){view=v;$('gloveStockCards').replaceChildren();v.items.forEach(function(i){var card=document.createElement('section'),title=document.createElement('p'),value=document.createElement('strong'),unit=document.createElement('small'),status=document.createElement('p');card.className='card';title.textContent='手袋 '+i.size;value.textContent=i.configured?i.count.toLocaleString():'未設定';unit.textContent=i.configured?' 枚':'';status.textContent=!i.configured?'初回は棚卸で実数を設定してください':i.low?'残りわずか・補充を確認':'現在庫';value.appendChild(unit);card.append(title,value,status);$('gloveStockCards').appendChild(card);});$('gloveStockNotice').textContent=v.notice;lock();}
function refresh(){busy=true;lock();staffRun().withSuccessHandler(function(v){busy=false;render(v);}).withFailureHandler(function(e){busy=false;lock();message(e.message||e);}).getGloveInventoryView();}
function done(v){pending=null;persist();busy=false;message('手袋'+v.size+'の在庫を'+v.after+'枚に保存しました。');$('gloveStockQuantity').value='';$('gloveStockNote').value='';refresh();loadHistory(true);}
function send(){busy=true;lock();staffRun(pending.meta).withSuccessHandler(done).withFailureHandler(function(e){busy=false;lock();message((e.message||e)+' 最新の保存状態を確認してください。');}).adjustGloveInventory(pending.input);}
function check(){busy=true;lock();staffRun().withSuccessHandler(function(s){busy=false;if(s.state==='DONE')return done(s.result);if(s.state==='REJECTED'){pending=null;persist();message(s.message);refresh();}else if(s.state==='NOT_FOUND'){message('未保存のため同じ内容で再送信します。');send();}else message('保存途中の可能性があります。重複登録せず管理者に確認してください。');lock();}).withFailureHandler(function(){busy=false;lock();message('保存状態を確認できません。接続回復後に確認してください。');}).getStaffMutationStatus(pending.meta.requestId);}
$('gloveStockSave').onclick=function(){if(busy||pending||!view)return;var raw=$('gloveStockQuantity').value,qty=Number(raw),note=$('gloveStockNote').value.trim(),kind=$('gloveStockKind').value;if(!raw||!Number.isInteger(qty)||qty<0||qty>1000000||kind==='RECEIVE'&&qty===0||!note){message('数量を整数で入力し、理由も記入してください。');return;}pending={input:{size:$('gloveStockSize').value,kind:kind,quantity:qty,note:note,expectedVersion:view.version},meta:makeStaffOperation_()};persist();send();};$('gloveStockRefresh').onclick=function(){if(busy)return;if(pending)check();else refresh();};
function loadHistory(reset){if(historyBusy&&!reset)return;var id=reset?++historyVersion:historyVersion;if(reset){filters={size:$('gloveHistorySize').value,kind:$('gloveHistoryKind').value,from:$('gloveHistoryFrom').value,to:$('gloveHistoryTo').value};next=null;shown=0;$('gloveHistoryRows').replaceChildren();}historyBusy=true;$('gloveHistoryMore').disabled=true;$('gloveHistoryStatus').textContent='履歴を読み込み中…';var input=Object.assign({},filters);if(!reset)input.beforeRow=next;staffRun().withSuccessHandler(function(v){if(id!==historyVersion)return;historyBusy=false;v.items.forEach(function(r){var tr=document.createElement('tr');[r.at,r.size,r.kindLabel,(r.delta>0?'+':'')+r.delta+'枚',r.after===null?'未設定':r.after+'枚',r.staffId,r.note].forEach(function(value,i){var td=document.createElement('td');td.textContent=value;if(i===3)td.className=r.delta>0?'glove-add':'glove-subtract';tr.appendChild(td);});$('gloveHistoryRows').appendChild(tr);});shown+=v.items.length;next=v.nextBeforeRow;$('gloveHistoryMore').hidden=next===null;$('gloveHistoryMore').disabled=false;$('gloveHistoryStatus').textContent=shown?shown+'件表示（新しい順）':'該当する履歴はありません。';}).withFailureHandler(function(e){if(id!==historyVersion)return;historyBusy=false;$('gloveHistoryMore').disabled=false;$('gloveHistoryStatus').textContent='履歴を取得できません：'+(e.message||e);}).getGloveMovementHistory(input);}
$('gloveHistorySearch').onclick=function(){loadHistory(true);};$('gloveHistoryMore').onclick=function(){loadHistory(false);};
renderAdminSidebar('gloveinventory');staffRun().withSuccessHandler(function(s){$('staffLabel').textContent=s.staffName;}).getStaffById(staffId);try{pending=JSON.parse(sessionStorage.getItem(key)||'null');}catch(e){}if(pending&&pending.input&&pending.meta)check();else{pending=null;refresh();}loadHistory(true);
})();
</script></body></html>
