<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイスパーク管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="app-icon.jpg"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script>
  <meta name="referrer" content="no-referrer">
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
</head>
<body data-layout-page="RainSuspend" class="layout-refresh">
  <section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>

  <div class="app-shell">
    <div id="adminSidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-header-title">雨天中断</h1>
          <div class="page-header-sub">中断・再開・中止の操作と、返金対象者の確認を行います</div>
        </div>
        <div class="page-header-meta">
          <span class="chip" id="staffLabel">読み込み中...</span>
        </div>
      </div>

      <div id="errorBox" class="msg-error" style="display:none;"></div>

      <div class="card">
        <div class="grid">
          <div class="card stat-card" style="margin:0;">
            <div class="value" id="onIceCount">-</div>
            <div class="label">現在氷上人数</div>
          </div>
          <div class="card stat-card" style="margin:0;">
            <div class="value" id="calledCount">-</div>
            <div class="label">呼出中人数</div>
          </div>
        </div>
        <div class="mt-16" style="text-align:center;">
          <span class="tag" id="statusTag">状態確認中...</span>
        </div>
      </div>

      <div class="card" id="suspendCard">
        <div class="section-title">中断・中止操作</div>
        <div class="field">
          <label>備考（任意）</label>
          <input type="text" id="opNote" placeholder="例：雷雨のため">
        </div>
        <button class="btn" id="startSuspendBtn" style="width:100%;">雨天中断を開始する</button>
        <button class="btn mt-16" id="resumeBtn" style="width:100%;">中断から再開する</button>
        <button class="btn btn-outline mt-16" id="cancelSessionBtn" style="width:100%;">本日の運営を中止する</button>
        <p class="loading mt-16">※「再開する」を押すと、現在氷上にいる全員の退場予定時刻が中断時間ぶん自動延長され、LINEで一斉通知されます。</p>
      </div>

      <div class="card" id="refundCard" style="display:none;">
        <div class="section-title">返金対象者（中断・中止から30分未満で入場／呼出済みの方）</div>
        <div id="refundList"></div>
        <button class="btn mt-16" id="recordRefundsBtn" style="width:100%;">返金対象として記録する</button>
      </div>

      <div class="card">
        <div class="section-title">本日の中断・中止履歴</div>
        <div id="eventList"></div>
      </div>
    </div>
  </div>

  <script>
    var staffId = window.staffPortal.staffId;
    var sessionToken = window.staffPortal.sessionToken;
    var baseUrl = window.staffPortal.baseUrl;

    var EVENT_LABEL = { SUSPEND: '中断開始', RESUME: '再開', CANCEL: '運営中止' };

    function showError(msg) {
      var box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function clearError() { document.getElementById('errorBox').style.display = 'none'; }

    var eligibleCache = [];

    function renderStatus(s) {
      document.getElementById('onIceCount').textContent = s.onIceCount;
      document.getElementById('calledCount').textContent = s.calledCount;
      var tag = document.getElementById('statusTag');
      if (s.cancelled) {
        tag.textContent = '本日は運営中止';
        tag.className = 'tag';
      } else if (s.suspended) {
        tag.textContent = '中断中';
        tag.className = 'tag';
      } else {
        tag.textContent = '通常営業中';
        tag.className = 'tag';
      }
      document.getElementById('startSuspendBtn').disabled = s.suspended || s.cancelled;
      document.getElementById('resumeBtn').disabled = !s.suspended;
      document.getElementById('cancelSessionBtn').disabled = s.cancelled;

      var showRefund = s.suspended || s.cancelled;
      document.getElementById('refundCard').style.display = showRefund ? 'block' : 'none';
      if (showRefund) loadRefundEligibility();

      var box = document.getElementById('eventList');
      if (s.events.length === 0) {
        box.innerHTML = '<div class="empty-hint">本日の記録はまだありません</div>';
      } else {
        box.innerHTML = '';
        s.events.forEach(function (e) {
          var row = document.createElement('div');
          row.className = 'list-row';
          row.innerHTML =
            '<div class="list-row-top"><div class="list-row-ticket">' + (EVENT_LABEL[e.eventType] || e.eventType) + '</div>' +
            '<span class="tag">' + e.occurredAtLabel + '</span></div>' +
            '<div class="list-row-sub">' +
              (e.eventType === 'RESUME' ? ('対象' + e.affectedCount + '名／延長' + e.suspendMinutes + '分　') : '') +
              (e.note ? ('備考：' + e.note) : '') +
            '</div>';
          box.appendChild(row);
        });
      }
    }

    function loadStatus() {
      clearError();
      staffRun()
        .withSuccessHandler(renderStatus)
        .withFailureHandler(function (err) { showError('状態の取得に失敗しました：' + (err && err.message ? err.message : err)); })
        .getRainSuspendStatus();
    }

    document.getElementById('startSuspendBtn').addEventListener('click', function () {
      if (!window.confirm('雨天中断を開始します。よろしいですか？')) return;
      clearError();
      var note = document.getElementById('opNote').value.trim();
      staffRun()
        .withSuccessHandler(function () { document.getElementById('opNote').value = ''; loadStatus(); })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .startRainSuspendApi(staffId, note);
    });

    document.getElementById('resumeBtn').addEventListener('click', function () {
      if (!window.confirm('中断から再開します。氷上にいる全員の退場予定時刻が延長され、LINE通知が送られます。よろしいですか？')) return;
      clearError();
      staffRun()
        .withSuccessHandler(function (res) {
          window.alert('再開しました。対象' + res.affectedCount + '名／延長' + res.delayMin + '分');
          loadStatus();
        })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .resumeRainSuspendApi(staffId);
    });

    document.getElementById('cancelSessionBtn').addEventListener('click', function () {
      if (!window.confirm('本日の運営を中止します。よろしいですか？（元に戻せません）')) return;
      clearError();
      var note = document.getElementById('opNote').value.trim();
      staffRun()
        .withSuccessHandler(function () { document.getElementById('opNote').value = ''; loadStatus(); })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .cancelSessionForRainApi(staffId, note);
    });

    function loadRefundEligibility() {
      staffRun()
        .withSuccessHandler(function (list) {
          eligibleCache = list;
          var box = document.getElementById('refundList');
          if (list.length === 0) {
            box.innerHTML = '<div class="empty-hint">現時点で返金対象の方はいません</div>';
            return;
          }
          box.innerHTML = '';
          list.forEach(function (r) {
            var row = document.createElement('div');
            row.className = 'list-row';
            row.innerHTML =
              '<div class="list-row-top"><div class="list-row-ticket">' + r.ticketNo + '</div></div>' +
              '<div class="list-row-sub">返金予定額：¥' + r.refundAmount + '</div>';
            box.appendChild(row);
          });
        })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .getRainRefundEligibilityApi();
    }

    document.getElementById('recordRefundsBtn').addEventListener('click', function () {
      if (eligibleCache.length === 0) { showError('返金対象がいません'); return; }
      if (!window.confirm(eligibleCache.length + '件を返金対象として記録します。よろしいですか？')) return;
      clearError();
      staffRun()
        .withSuccessHandler(function () { window.alert('記録しました。'); loadRefundEligibility(); })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .recordRainRefundsApi(eligibleCache, staffId);
    });

    function loadStaffLabel() {
      if (!staffId) return;
      staffRun()
        .withSuccessHandler(function (staff) {
          if (staff) {
            document.getElementById('staffLabel').textContent =
              staff.staffName + (staff.role === 'ADMIN' ? '（管理者）' : '');
          }
        })
        .getStaffById(staffId);
    }

    renderAdminSidebar('rainsuspend');
    loadStaffLabel();
    loadStatus();
    setInterval(loadStatus, 20000);
  </script>
</body>
</html>
